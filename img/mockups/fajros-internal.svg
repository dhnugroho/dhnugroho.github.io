                          <text x="493" y="95" fill="#ffb74d" font-size="5.5" font-weight="bold" text-anchor="middle"
                            font-family="sans-serif">Markimar</text>
                          <rect x="470" y="106" width="46" height="10" rx="2" fill="#11292d" />
                          <text x="493" y="113" fill="#4ecdc4" font-size="5.5" font-weight="bold" text-anchor="middle"
