                          <circle cx="332" cy="276" r="6" fill="#4ecdc4" />
                          <text x="332" y="289" fill="#8892a4" font-size="6" font-weight="bold" text-anchor="middle"
                            font-family="sans-serif">W</text>

                          <circle cx="357" cy="276" r="6" fill="#ff6b6b" />
                          <text x="357" y="289" fill="#8892a4" font-size="6" font-weight="bold" text-anchor="middle"
