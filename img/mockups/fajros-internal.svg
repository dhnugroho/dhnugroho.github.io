                            font-family="sans-serif">F</text>

                          <circle cx="407" cy="276" r="6" fill="#4ecdc4" />
                          <text x="407" y="289" fill="#8892a4" font-size="6" font-weight="bold" text-anchor="middle"
                            font-family="sans-serif">S</text>

